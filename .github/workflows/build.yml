name: Build static site

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run build
      - name: Verify SEO outputs
        run: |
          set -euxo pipefail
          test -f dist/index.html
          test -f dist/articles/index.html
          test -f dist/topics/index.html
          test -f dist/tools/index.html
          test -f dist/feed.xml
          test -f dist/sitemap.xml
          test -f dist/robots.txt
          test "$(find dist/articles -mindepth 2 -name index.html | wc -l)" -eq 18
          test "$(find dist/topics -mindepth 2 -name index.html | wc -l)" -eq 3
          test "$(find dist/tools -mindepth 2 -name index.html | wc -l)" -eq 4
          test "$(grep -c '<url>' dist/sitemap.xml)" -eq 30
          grep -q '<lastmod>' dist/sitemap.xml
          grep -q 'application/rss+xml' dist/index.html
